name: Release (public core)

# Automated release pipeline for #191 / #57 - one workflow, one rolling channel
# per release train and tier, resolved by convention rather than by a table here:
#
#   push -> main          publishes the 'stable' prerelease        (release tier)
#   push -> beta_vX.Y.Z   publishes the 'vX.Y.Z-beta' prerelease   (test tier)
#   push -> dev_vX.Y.Z    publishes the 'vX.Y.Z-alpha' prerelease  (dev tier)
#
# scripts/dispatch/release_channel.ps1 owns that mapping; everything downstream
# (zip label, the local describe tag, publish_release.ps1) reads it from there.
#
# On pull requests it builds + packages only (NO publish) as a build gate.
#
#   detect ──> build-publish (Windows) ──┐
#         └──> linux-bundle  (Linux) ────┴──> build (gate) ──> publish (push only)
#
# `build` is the one check branch protection requires: it passes only when BOTH
# platforms built, or detect said there was nothing to build. `publish` waits for
# it and recreates the rolling release with both zips at once (#376, #408).
#
# The build runs the real dispatch flow with RS_FIXS_AUTOMATION, so the licensed
# toolchain steps (VISSIM 3, CarMaker 5a, dSPACE 5b, MEX 6) are skipped. On the
# 0.9.0 train VirtualEnvironment (step 4) is SDK-free (#174), so it builds on the
# hosted runner and VirtualEnvironment.lib ships in alpha_v0.9.0; on main it is
# still skipped (needs the CarMaker SDK) until the SDK-free refactor reaches that
# train. The remaining proprietary binaries return via the pinned
# ProprietaryBinaries bundle (also #191).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built zip to this branch''s rolling prerelease'
        type: boolean
        default: false
  # Globbed, not listed, so a new train OR tier is a branch name and nothing else -
  # which is the rule scripts/dispatch/release_channel.ps1 already states
  # ("dev_v0.10.0 gets its v0.10.0-alpha channel the day the branch is created").
  # That was only ever true of the CHANNEL; the trigger stayed a literal list, so
  # dev_v0.10.0 built nothing and PRs targeting it ran no build gate at all.
  #
  # Publishing stays guarded independently: release_channel.ps1 sets a channel only
  # for an exact dev_vX.Y.Z / beta_vX.Y.Z, so a branch like dev_v0.10.0_wip builds
  # and never publishes.
  pull_request:
    branches: [dev, main, 'dev_v*', 'beta_v*']
  push:
    branches: [main, 'dev_v*', 'beta_v*']

# One run per ref at a time. Two pushes close together used to run side by side
# and both recreate the same rolling release, so whichever published LAST won -
# possibly the older commit. Pushes now queue (a newer queued push replaces an
# older queued one, which is fine: the rolling release only wants the newest).
# On a PR a new push makes the running build moot, so that one is cancelled. #408.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write        # create/update the rolling release + tag on publish
  pull-requests: read    # the detect step lists the PR's changed files via the API

jobs:
  # One answer to "does this change need a build?", read by BOTH platforms. It
  # used to be a step inside the Windows job, so the Linux job could only read it
  # by waiting for the whole Windows build (#376) - and when that wait was dropped,
  # Linux built on every PR, including ones with nothing to build (#408). A job of
  # its own costs a few seconds and both builds still start together.
  #
  # Decide BEFORE checking out: the PR's file list comes from the API, which needs
  # no working tree. This gate once ran after a fetch-depth:0 checkout and a PR
  # with nothing to build paid 1183 s (19.7 min, run 31040679954) to skip. #191.
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Detect build-relevant changes
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT:  ${{ github.event_name }}
          PR:     ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER:  ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') ;;
            push)
              # A new branch, a force-push or a diff past the API's 300-file cap has no exact list.
              cmp=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" \
                      --jq '"\(.status) \(.files | length)"') || cmp="error 0"
              read -r status count <<< "$cmp"
              if [ "$status" != ahead ] || [ "$count" -ge 300 ]; then
                echo "push $BEFORE..$AFTER: compare status=$status files=$count -> build."
                echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') ;;
            *)
              echo "event=$EVENT -> always build."
              echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "Changed files:"; echo "$files"

          # release.yml defines THIS build, so a change to it must still build -
          # otherwise a change to the build pipeline would never test itself.
          if echo "$files" | grep -qE '^\.github/workflows/release\.yml$'; then
            echo "release.yml itself changed -> build to validate the pipeline."
            echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # An ignore-list, NOT an allow-list: anything unrecognised builds, so a
          # new source directory is covered by default. That is the safe direction
          # for a required check - a missing ignore entry costs one ~3 min build,
          # a missing allow entry silently skips validation and still shows green.
          #   ^doc/ ^tests/          never read by dispatch.bat or 8_create_zip.ps1
          #   ^.github/ ^.vscode/    CI + editor config (release.yml exempted above)
          #   *.py                   Python is COPIED into build/ (dispatch.bat:244)
          #                          and into the zip, never compiled or executed
          #                          here - building validates nothing about it.
          #                          pytest is the right gate for Python (#57).
          #   environment.yml        copied into the zip only (8_create_zip.ps1:110);
          #                          a real env check is #248, not a C++ compile
          #   scripts/update_fixs.*  consumer-side installer (#272) - not a build
          #                          input, and not packaged (8_create_zip.ps1:119)
          # NOTE: ^scripts/ must NOT be ignored wholesale - scripts/dispatch/** IS
          # the build system, and generate_version.ps1 stamps the version.
          ignore='^doc/|^tests/|^\.github/|^\.vscode/|\.md$|\.py$|^LICENSE$|^\.gitignore$|^\.gitattributes$|^environment\.yml$|^scripts/update_fixs\.(ps1|sh)$'
          # A push publishes the zip, and .py, environment.yml and Carla/*.md ship in it.
          [ "$EVENT" = push ] && ignore='^doc/|^tests/|^\.github/|^\.vscode/|^[^/]+\.md$|^LICENSE$|^\.gitignore$|^\.gitattributes$|^scripts/update_fixs\.(ps1|sh)$'
          relevant=$(echo "$files" | grep -vE "$ignore" || true)
          if [ -z "$relevant" ]; then
            echo "No build-relevant changes -> skipping build (required check still passes)."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Build-relevant changes:"; echo "$relevant"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-publish:
    # Named for what it used to do; it builds Windows and no longer publishes
    # (that is the `publish` job). Kept because branch protection requires a check
    # by this name until it is switched to `build` - renaming it first would leave
    # every PR waiting on a check that never reports. #408.
    #
    # windows-2022 = VS 2022 (v17), matching the generator dispatch derives from
    # dependencies.yaml. windows-latest ships VS 2026 (v18), incompatible.
    runs-on: windows-2022
    needs: detect
    # The channel, resolved once here, is what `publish` names the release and
    # both zips after, so the two platforms land under ONE tag.
    outputs:
      publish: ${{ steps.channel.outputs.publish }}
      tag:     ${{ steps.channel.outputs.tag }}
      title:   ${{ steps.channel.outputs.title }}
    # The job RUNS either way and only its steps are gated, so it reports green on
    # a PR with nothing to build without anyone relying on a skipped job counting
    # as a pass.
    steps:
      # fetch-depth: 0 is mandatory - `git describe --match 'v[0-9]*'` (below, and
      # in generate_version.ps1) needs every commit and tag to find the nearest
      # version ancestor. What it does NOT need is the file *contents* of those
      # commits, and that is where the ~1 GB went: ~2.5 GiB of historical blob
      # versions (deleted CM*_proj trees, a committed .venv, old build outputs)
      # that no build step ever opens. #255.
      #   filter: blob:none  -> fetch commits + trees, but no blobs up front; git
      #                         lazily fetches only the blobs actually read. History
      #                         stays complete, so git describe is unaffected.
      #   sparse-checkout    -> HEAD is 231 MiB, but tests/ (197 MiB) and doc/
      #                         (21 MiB) are 218 MiB of that and are never read by
      #                         scripts/dispatch/dispatch.bat or 8_create_zip.ps1 -
      #                         the same two directories the detect step above
      #                         already ignores. Measured: excluding them takes the
      #                         working tree from 231 MiB to 13 MiB. (CommonLib/
      #                         YAMLMatlab/Tests is NOT affected - it lives under
      #                         CommonLib/, which stays.)
      #                         cone-mode must be off: cone mode can only express
      #                         "include these", not "everything except these".
      # Mirrors the fix PR #240 applied to bundle-guard.yml (24 min -> 1 s there).
      - name: Checkout (full history for git describe; blobs on demand)
        if: needs.detect.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/tests/
            !/doc/
          sparse-checkout-cone-mode: false
          submodules: false

      - name: Add MSBuild to PATH
        if: needs.detect.outputs.should_build == 'true'
        uses: microsoft/setup-msbuild@v2

      # Speed: yaml-cpp is vendored and rebuilt (Release+Debug) from source every
      # run, but it almost never changes. Cache CommonLib/yaml-cpp/build keyed on
      # the yaml-cpp source hash - on a hit, dispatch.bat's existing
      # "if not exist yaml-cpp\build" guard skips step 1 entirely.
      # Gated too: with the checkout skipped there is no working tree, so
      # hashFiles() would resolve to an empty string and poison the cache key.
      - name: Cache yaml-cpp build
        if: needs.detect.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: CommonLib/yaml-cpp/build
          key: yamlcpp-${{ runner.os }}-vs2022-${{ hashFiles('CommonLib/yaml-cpp/CMakeLists.txt', 'CommonLib/yaml-cpp/include/**', 'CommonLib/yaml-cpp/src/**') }}

      # Which rolling channel does this branch publish to? One convention-driven
      # script answers that (main -> latest, dev_vX.Y.Z -> vX.Y.Z-alpha), and
      # every step below reads its answer: the zip name, the local describe tag,
      # and the publish call. Adding the next train needs no edit here.
      # On PRs it resolves to "no channel", so PR zips keep git-derived names
      # and nothing publishes.
      - name: Resolve release channel
        id: channel
        if: needs.detect.outputs.should_build == 'true'
        shell: pwsh
        run: '& scripts/dispatch/release_channel.ps1 -Ref "${{ github.ref }}"'

      # Place the channel's version tag at HEAD *locally* so this build's
      # `git describe --match 'v[0-9]*'` stamps the right line into
      # RealSimVersion.h (otherwise the 0.9.0 train finds v0.7.0, the nearest
      # ancestor, and the compiled version reads 0.7.0). LOCAL only - the real,
      # persistent tag is (re)created by the publish step as a prerelease
      # Release anchored to this commit, so there's exactly ONE tag and it's
      # never orphaned if the build fails. #191.
      # Only for semver-shaped channel tags: 'latest' is not a version.
      - name: Stamp the channel version tag for this build (local, for git describe)
        if: github.event_name == 'push' && steps.channel.outputs.semver == 'true'
        shell: bash
        env:
          CHANNEL_TAG: ${{ steps.channel.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$CHANNEL_TAG" -m "$CHANNEL_TAG at $(git rev-parse --short HEAD)"

      # libcarla (~460 MB release subset) is gitignored and only needed to build
      # the PUBLIC VirCarlaEnv exe. Fetch it from the public fixs-native-deps
      # release (prebuilt, gh-free), cached by dependencies.yaml so it downloads
      # at most once per deps version. On a cache hit fetch_native_deps skips;
      # dispatch step 4c then builds VirCarlaEnv against it. REQUIRED here, though
      # optional on a developer box: the bundle ships the Carla co-sim, so a
      # release without VirCarlaEnv.exe is incomplete. It used to soft-warn, and
      # VirCarlaEnv went missing from every bundle without anyone noticing. #380.
      - name: Cache libcarla (native deps)
        if: needs.detect.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: CommonLib/libcarla
          key: libcarla-${{ runner.os }}-${{ hashFiles('dependencies.yaml') }}
      - name: Fetch libcarla (prebuilt) for the VirCarlaEnv build
        if: needs.detect.outputs.should_build == 'true'
        shell: pwsh
        run: |
          & scripts/dispatch/fetch_native_deps.ps1 -Component carla -Mode prebuilt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::libcarla prebuilt fetch failed - VirCarlaEnv cannot build without it. Check that the libcarla asset for dependencies.yaml's CARLA version is published on the fixs-native-deps release."
            exit 1
          }

      # libsumo (~127 MB) is REQUIRED, not optional like libcarla: since #238 it
      # is no longer committed to git, and TrafficLayer.vcxproj links
      # CommonLib\libsumo\bin\libsumocpp.lib directly - so step 2 of dispatch
      # cannot build without it. Fetched explicitly here (rather than leaving it
      # to dispatch's initialize step) purely so a bad/absent release asset
      # fails with a clear message instead of a link error 10 minutes later.
      # Cached on dependencies.yaml so it downloads at most once per deps version.
      - name: Cache libsumo (native deps)
        if: needs.detect.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: CommonLib/libsumo
          key: libsumo-${{ runner.os }}-${{ hashFiles('dependencies.yaml') }}
      - name: Fetch libsumo (prebuilt, required)
        if: needs.detect.outputs.should_build == 'true'
        shell: pwsh
        run: |
          & scripts/dispatch/fetch_native_deps.ps1 -Component sumo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::libsumo fetch failed - TrafficLayer cannot link without it. Check that libsumo-<ver>-windows-x86_64.zip is published on the fixs-native-deps release."
            exit 1
          }

      # RS_FIXS_VERSION_LABEL names the zip after the channel it will be
      # published to (fixs-build-latest.zip, fixs-build-v0.9.0-alpha.zip), read
      # by 8_create_zip.ps1 through dispatch step 8. Empty on PRs, where the
      # script falls back to the commit-traceable git describe name.
      - name: Build + package (proprietary steps skipped; VE.lib builds on 0.9.0)
        if: needs.detect.outputs.should_build == 'true'
        shell: cmd
        env:
          RS_FIXS_VERSION_LABEL: ${{ steps.channel.outputs.tag }}
        run: |
          set RS_BUILD_CONFIG=Release
          set RS_FIXS_AUTOMATION=1
          REM <nul so the trailing `pause` in dispatch.bat returns immediately.
          call scripts\dispatch\dispatch.bat <nul

      # Overlay the licensed-toolchain binaries (VISSIM/CarMaker/dSPACE/MEX) that
      # the hosted runner cannot build, pulled from the Binaries-<key> release on
      # THIS repo (native token). The key = ProprietaryFiles SHA (bundle_key.ps1),
      # so the bundle is paired to the proprietary source it was built from. Then
      # re-pack the complete zip.
      # OPTIONAL for now: if no bundle is published for this key yet, ship
      # public-core with a warning (bootstrap). Flip to a hard failure once the
      # first bundle exists, so a "complete" release can never silently drop its
      # binaries. The bundle-guard PR check makes the missing-bundle case
      # unmergeable in the first place (#191).
      - name: Overlay proprietary bundle (Binaries-<key>, if published)
        if: needs.detect.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Same channel label as the first pack, so the re-pack overwrites the
          # public-core zip in place instead of leaving two differently-named
          # zips in build/ for publish_release.ps1 to choose between.
          RS_FIXS_VERSION_LABEL: ${{ steps.channel.outputs.tag }}
        run: |
          $key = (& scripts/dispatch/bundle_key.ps1).Trim()
          $tag = "Binaries-$key"
          Write-Host "Bundle key: $key  ->  release $tag"
          $tmp = Join-Path $env:RUNNER_TEMP "fixs-bin"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'fixs-binaries-*.zip' --dir $tmp --clobber 2>$null
          $bundle = Get-ChildItem $tmp -Filter 'fixs-binaries-*.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bundle) {
            Write-Warning "No $tag release - shipping public-core only. Publish it via scripts/dispatch/pack_binaries.ps1 -Publish on a licensed box."
            exit 0
          }
          $x = Join-Path $tmp 'unzipped'
          Expand-Archive -Path $bundle.FullName -DestinationPath $x -Force
          # Overlay into build/ (everything except the manifest), then re-pack.
          # No wire-format check needed: the key encodes the contract hash, so a
          # matching $tag is guaranteed compatible.
          Get-ChildItem $x -Exclude 'manifest.json' | ForEach-Object {
            Copy-Item $_.FullName -Destination build -Recurse -Force
          }
          $n = (Get-ChildItem $x -Recurse -File | Where-Object { $_.Name -ne 'manifest.json' }).Count
          Write-Host "Overlaid $n proprietary files into build/; re-packing complete zip..."
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/dispatch/8_create_zip.ps1 -RunMode inline

      - name: Sanity-check the packaged zip
        if: needs.detect.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $zip = Get-ChildItem build -Filter 'fixs-build-*.zip' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $zip) { Write-Error "No fixs-build-*.zip produced (see build-logs)."; exit 1 }
          Write-Host "Packaged: $($zip.Name) ($([math]::Round($zip.Length/1MB,1)) MB)"
          $names = Get-ChildItem build -Recurse -File | ForEach-Object { $_.Name }
          if ($names -notcontains 'TrafficLayer.exe') {
            Write-Error "TrafficLayer.exe missing from build/ - public core did not build."
            exit 1
          }
          # Read the ZIP, not build/: the zip is what ships, and its lacking
          # the file is how #380 went unnoticed.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try { $entries = $z.Entries | ForEach-Object { $_.FullName -replace '\\', '/' } }
          finally { $z.Dispose() }
          if ($entries -notcontains 'VirCarlaEnv.exe') {
            Write-Error "VirCarlaEnv.exe missing from $($zip.Name) - the C++ Carla bridge did not build or was not packaged (#380)."
            exit 1
          }
          Write-Host "VirCarlaEnv.exe present in $($zip.Name)."
          if ($names -contains 'VirtualEnvironment.lib') {
            Write-Host "VirtualEnvironment.lib present (SDK-free CI build - expected on the 0.9.0 train)."
          } else {
            Write-Host "VirtualEnvironment.lib absent (expected on the current/main train)."
          }

      - name: Upload packaged zip as a workflow artifact (inspect on PRs)
        if: needs.detect.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fixs-build-zip
          path: build/fixs-build-*.zip
          if-no-files-found: warn

      # Keep the old loud behaviour for a hand-dispatched publish from a branch
      # that has no channel: skipping silently would look like a successful
      # publish in the run summary.
      - name: Warn - publish requested from a branch with no channel
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.channel.outputs.publish != 'true'
        shell: bash
        run: |
          echo "::warning::${{ github.ref }} has no rolling channel (main -> stable, beta_vX.Y.Z -> vX.Y.Z-beta, dev_vX.Y.Z -> vX.Y.Z-alpha). Nothing was published."

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            scripts/dispatch/build.log
            scripts/dispatch/build_summary.log
          if-no-files-found: ignore

  # ===========================================================================
  # The Linux half of the same release: fixs-build-<ver>-linux-x86_64.zip beside
  # the Windows bundle, selected by platform in update_fixs.{sh,ps1}.
  #
  # Built in a STOCK ubuntu:20.04 container, and that is the whole point. glibc
  # and libstdc++ are forward-compatible only, so a focal-built binary runs on
  # 20.04, 22.04 and 24.04 while a noble-built one runs on noble alone --
  # measured by running both across all three. The jammy/noble legs in
  # linux-build.yml stay a COMPILE gate; their artifacts must never ship.
  # ===========================================================================
  # Needs `detect` only, NOT build-publish. It once waited on the whole Windows
  # build to borrow should_build and the channel tag, and that ordering opened a
  # 1m45s window after every push where the release had no Linux bundle (#376).
  # Both builds now start as soon as detect answers; the channel name is applied
  # at publish time.
  linux-bundle:
    name: Linux bundle (focal)
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # No SUMO or CARLA build dependencies: both runtimes are fetched
          # prebuilt from the rolling native-deps release.
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates curl unzip zip python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git describe needs tags for the version stamp
          filter: blob:none     # full history, but only HEAD's file contents
          submodules: false     # ProprietaryFiles is private and not needed here

      # git refuses to run in a checkout owned by another uid (container vs runner).
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Guard - MSBuild and CMake TU lists agree
        run: python3 scripts/check_source_lists.py

      - name: Fetch native deps (prebuilt libtraci + libcarla)
        run: |
          ./scripts/fetch_native_deps.sh
          ./scripts/fetch_native_deps.sh --component carla

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
          # A skipped VirCarlaEnv is right for a developer without the SDK and
          # wrong here: the fetch above was supposed to provide it, so a bundle
          # missing it would ship silently reduced.
          test -x build/VirCarlaEnv || { echo "VirCarlaEnv was skipped despite a fetched SDK"; exit 1; }

      # Packs, and re-checks that neither binary requires anything newer than
      # focal provides -- the check that catches a build environment which IS
      # 20.04 but carries a newer libstdc++.
      # No --version: the packer derives the label from `git describe`, as the
      # Windows side does. The CHANNEL name is not known here -- that is
      # build-publish's output, and this job does not wait for it -- so `publish`
      # renames the file to the channel before uploading. The tag still has
      # exactly one source of truth.
      - name: Pack the Linux bundle
        run: ./scripts/dispatch/pack_linux_bundle.sh --out-dir dist

      - name: Upload bundle as a workflow artifact (inspect on PRs)
        uses: actions/upload-artifact@v4
        with:
          name: fixs-build-zip-linux
          path: dist/fixs-build-*-linux-x86_64.zip
          if-no-files-found: error

  # ===========================================================================
  # The check branch protection requires (#408). Windows and Linux are separate
  # jobs, and until this existed only the Windows one could block a merge: a PR
  # that broke the Linux build showed a red X and merged anyway.
  #
  # `!cancelled()` so it still runs - and fails - when a build failed or was
  # skipped; a required check that is itself skipped would read as a pass. Linux
  # may be skipped only when detect said there was nothing to build. Windows
  # always runs (its steps are gated, not the job), so it must succeed.
  # ===========================================================================
  build:
    needs: [detect, build-publish, linux-bundle]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Both platforms built, or neither needed to
        env:
          DETECT:       ${{ needs.detect.result }}
          SHOULD_BUILD: ${{ needs.detect.outputs.should_build }}
          WINDOWS:      ${{ needs.build-publish.result }}
          LINUX:        ${{ needs.linux-bundle.result }}
        run: |
          echo "detect=$DETECT should_build=$SHOULD_BUILD windows=$WINDOWS linux=$LINUX"
          [ "$DETECT" = success ] || { echo "::error::change detection: $DETECT"; exit 1; }
          [ "$WINDOWS" = success ] || { echo "::error::Windows build: $WINDOWS"; exit 1; }
          want=skipped; [ "$SHOULD_BUILD" = true ] && want=success
          [ "$LINUX" = "$want" ] || { echo "::error::Linux build: $LINUX (expected $want)"; exit 1; }

  # Both bundles in ONE `gh release create`, after the gate (#376 step 2). The
  # rolling tag is re-pointed by deleting and recreating the release, which drops
  # every asset; when each platform published from its own job, the release sat
  # with the Windows zip alone until the Linux upload landed, and a failed Linux
  # build left it with no Linux zip at all. Now neither platform publishes unless
  # both built. What remains is the few seconds between the delete and the
  # create, inherent to re-pointing a tag this way.
  #
  # windows-2022 because publish_release.ps1 has only ever run under Windows
  # PowerShell; moving it to pwsh on Linux is a change to make with a run to show.
  publish:
    name: Publish release
    needs: [build, build-publish]
    if: needs.build-publish.outputs.publish == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: windows-2022
    steps:
      # The script and the commit it writes into the release notes; no build tree.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/dispatch
          submodules: false

      # publish_release.ps1 takes the newest fixs-build-*.zip in build/ as the
      # main asset, so the Linux zip goes to dist/, where that glob cannot pick it.
      - uses: actions/download-artifact@v4
        with:
          name: fixs-build-zip
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: fixs-build-zip-linux
          path: dist

      - name: Publish both bundles to the branch's channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_TAG: ${{ needs.build-publish.outputs.tag }}
          CHANNEL_TITLE: ${{ needs.build-publish.outputs.title }}
        run: |
          # The Linux bundle was packed before the channel was known, so it carries
          # the git-derived label. Name it after the channel it is published to, so
          # both assets on one release agree -- a consumer picks between them on the
          # platform suffix and reads the rest as the version.
          $linux = Get-ChildItem dist -Filter 'fixs-build-*-linux-x86_64.zip' | Select-Object -First 1
          if (-not $linux) { Write-Error "No Linux bundle in the fixs-build-zip-linux artifact."; exit 1 }
          $want = "fixs-build-$env:CHANNEL_TAG-linux-x86_64.zip"
          if ($linux.Name -ne $want) {
            Write-Host "renaming $($linux.Name) -> $want"
            Rename-Item $linux.FullName $want
          }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\dispatch\publish_release.ps1 `
              -Tag $env:CHANNEL_TAG -Title $env:CHANNEL_TITLE -Rolling -Target $env:GITHUB_SHA `
              -Asset (Join-Path dist $want)
          exit $LASTEXITCODE
