name: realsim
channels:
  - conda-forge
  - defaults
channel_priority: strict

dependencies:
  - python=3.10
  # Carla/carla_agents' global_route_planner imports networkx, so a controller
  # that brings a CARLA agent (BasicAgent/BehaviorAgent) fails to import at all
  # without it: mainVirCarla dies at startup and takes the stack down with it
  # (#378). It was declared in requirements.txt (#305) - a file nothing installed,
  # which is why an env built from this spec never got it. That file has since been
  # removed (#221): one manifest for the python, dependencies.yaml for the tools.
  - networkx
  - numpy
  - pandas
  - plotly
  - pygame
  - protobuf
  - pytest
  - pyyaml
  - shapely
  # standalone/run_synchronization/sumo_integration/sumo_simulation.py imports
  # lxml.etree, and nothing else installs it, so it has to be declared here.
  - lxml
  # No vs2015_runtime / vc14_runtime: they exist for Windows only, so listing them
  # failed every Linux build of this spec, and on Windows python itself depends on
  # vc14_runtime - a solve with or without them installs the same 103 packages.
  - pip
  # ViewSetup camera windows and recordings (Carla/VirEnv/CarlaViews.py), and the
  # HUD drawn on them (CarlaHud.py). PyPI wheels, so the conda and uv envs carry
  # the same distributions.
  - pip:
    - opencv-python
    - pillow
  # No carla, traci or sumolib here on purpose. The release zip strips *.whl from
  # Carla/ (scripts/dispatch/8_create_zip.ps1), so a wheel path in this spec makes
  # `conda env create -f environment.yml` fail on every machine that consumes a
  # release - including carla_env_setup's own offer to create the env.
  # carla_env_setup.ensure_carla() installs the client after the env exists, and
  # picks the right one for the mode: the PyPI wheel (carla==0.9.15) for packaged
  # and client, the source build's own wheel for a source build; the same module
  # installs eclipse-sumo/traci/sumolib alongside it.
